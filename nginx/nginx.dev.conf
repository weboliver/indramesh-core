events {
    worker_connections 1024;
}

http {
    # Loosened for the E2E suite (Phase 138): the single e2e-tests container is
    # the only heavy API consumer in this dev stack and was exhausting the
    # 200r/m cap under full-suite request volume, causing 429s that surfaced as
    # test timeouts. Raised so the full suite passes without retries. Real
    # external clients are still bounded (1000r/m + burst), just less tight.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # D-11 — public realm perimeter zone: coarse IP-based guard only.
    # Per-token limiting happens in the backend (plaintext tokens never
    # enter nginx shared memory — D-09).
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=1000r/m;
    client_max_body_size 1m;

    # Phase 106 — gzip compression for API responses (API-01)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/html application/javascript;
    gzip_proxied any;
    gzip_vary on;

    # Phase 298 (D-17): an inbound X-Request-ID is forwarded only when it matches
    # the backend's own validation regex (^[A-Za-z0-9-]{8,64}$); absent, malformed
    # or oversized values fall back to nginx's own $request_id. So nginx and the
    # backend always correlate on the same id, and a client cannot inject an
    # arbitrary header value (T-298-23).
    map $http_x_request_id $indramesh_request_id {
        "~^[A-Za-z0-9-]{8,64}$" $http_x_request_id;
        default                 $request_id;
    }

    # Phase 298 (D-12/D-17): the access log keeps its combined text shape and
    # appends the same rid= the backend records (nginx stays text, not JSON).
    log_format indramesh_main '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rid=$indramesh_request_id';
    access_log /dev/stdout indramesh_main;

    # Phase 323 (D-07): Docker's embedded DNS is reachable only inside a Compose
    # container. With the names re-resolved at runtime, a recreated or restarted
    # backend/frontend is followed once the `valid` window (ten seconds) lapses,
    # instead of needing `nginx -s reload` after every container change.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        # `resolve` requires the server group to live in a shared memory zone.
        zone backend 64k;
        server backend:8000 resolve;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:5173 resolve;
    }

    # Host-mapped HTTP_PORT -> HTTPS_PORT pairing for the redirect below.
    # nginx runs inside the container and only ever sees its own internal
    # ports 80/443 — it has no visibility into Docker's host port mapping.
    # $host (used by the old `return 301 https://$host$request_uri;`) is
    # ALWAYS port-stripped by nginx regardless of what the client sent —
    # confirmed live (2026-09-03): a request with `Host: localhost:8180`
    # redirected to `https://localhost/` (no port at all), not
    # `https://localhost:8180/` as the port-rewrite theory first assumed.
    # A portless https redirect implies the PROTOCOL DEFAULT port (443),
    # which nothing listens on externally once HTTPS_PORT != 443 (default
    # since this dev stack moved off 80/443 to avoid colliding with the k3s
    # bridge/Jira — see docs/DEPLOYMENT.md) — so the redirect must ALWAYS name
    # the correct external HTTPS port explicitly. `$http_host` (the raw,
    # unnormalized Host header) is used here instead of `$host` because it
    # DOES carry the port the client actually sent — internal
    # container-to-container traffic (e2e-tests' `https://nginx`) sends
    # `Host: nginx` (no port, default 80 implied, must stay portless so it
    # keeps hitting nginx's real internal 443), while an external browser on
    # the host-mapped port sends `Host: localhost:8180` (must become
    # `:8443`). These maps rewrite that specific default pair; if you
    # override HTTP_PORT/HTTPS_PORT in .env away from 8180/8443, update the
    # regex/replacement below to match — this is a static default-only
    # translation, not read from the environment (same "not wired for
    # override" class of limitation TLS_CERT_DIR already documents in
    # docs/CONFIGURATION.md).
    map $http_host $redirect_host {
        default                   $http_host;
        "~^(?<h>.+):8180$"        $h;
    }
    map $http_host $redirect_port {
        default      "";
        "~:8180$"    ":8443";
    }

    # Phase 95 — HTTP server (port 80) — redirect all traffic to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$redirect_host$redirect_port$request_uri;
    }

    # Phase 95 — HTTPS server (port 443) — the app, now over TLS
    server {
        listen 443 ssl http2;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Found live 2026-09-03 (same bug independently confirmed in the k8s
        # chart's deploy/helm/indramesh/nginx.conf): nginx auto-redirects a
        # bare "/api" or "/public" (no trailing slash) to "/api/"/"/public/"
        # for the proxy_pass locations below — nginx's own built-in
        # path-normalization redirect, not a `return` statement in this
        # file. By default it emits an ABSOLUTE URL via $server_port — this
        # container's INTERNAL listener (443) — which is no longer what an
        # external client used once this dev stack moved off the 80/443
        # defaults (host-mapped ${HTTPS_PORT:-8443}); a request to
        # https://localhost:8443/api landed on a dead
        # "https://localhost/api/" redirect (wrong port, dropped entirely).
        # `absolute_redirect off` makes these auto-redirects emit a bare
        # relative path instead ("Location: /api/", no scheme/host/port) —
        # the browser resolves it against whatever origin it actually used,
        # correct for any host-mapped port without hardcoding one. (The
        # explicit `return 301` above, in the :80 server block, is unrelated
        # to this directive — that redirect is hand-written via
        # $redirect_host/$redirect_port and unaffected either way.)
        absolute_redirect off;

        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 279 (R-01): upload-route-only ceiling exception. The generic
        # `client_max_body_size 1m` would reject the default 50 MB per-file
        # policy before the backend's authoritative bounded chunk counter
        # could run; `0` disables the static check for exactly this POST
        # location (D-09). Regex locations take precedence over the /api/
        # prefix location; everything else keeps the 1 MiB gateway guard.
        # The backend MaximumContentLengthMiddleware carries the matching
        # route-only exemption (backend/app/main.py).
        location ~ ^/api/v1/objects/[^/]+/files/upload$ {
            limit_req zone=api_limit burst=1000 nodelay;
            limit_req_status 429;
            client_max_body_size 0;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 317 (CR314-24): the two CSV import uploads carry their own
        # bounded ceiling. Both routes stream the body into a handler-side
        # `IMPORT_MAX_FILE_SIZE` check (default 50 MiB) that stays authoritative;
        # the generic `client_max_body_size 1m` above would refuse every body
        # between 1 MiB and that documented limit before the handler ever ran.
        # 64m deliberately, not `0` like the object-file location above: that
        # path relays into storage without ever holding the file, whereas the
        # CSV handler accumulates up to its limit in memory — an unbounded
        # gateway would hand it an arbitrarily large stream. 64 MiB sits above
        # the 50 MiB default so the handler decides for every body the
        # documentation promises. Raising IMPORT_MAX_FILE_SIZE past 64 MiB
        # means raising this ceiling in BOTH nginx/nginx.conf and
        # deploy/helm/indramesh/nginx.conf (the chart embeds its copy verbatim).
        # Anchored and POST-only in the backend's matching exemption tuple
        # (backend/app/main.py `_BODY_LIMIT_EXEMPT_POST_PATHS`) — never widen
        # this to a path prefix, which would exempt every method on
        # /api/v1/imports/* as well. These two files must stay identical here.
        location ~ ^/api/v1/(imports/csv/upload|import-definitions/[^/]+/folder-files)$ {
            limit_req zone=api_limit burst=1000 nodelay;
            limit_req_status 429;
            client_max_body_size 64m;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        location /api/ {
            limit_req zone=api_limit burst=1000 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            # Replace the upstream sniffing header with exactly one gateway copy;
            # "always" also covers nginx-generated 429/502/504 responses.
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # D-11 / AUTH-05 — public realm perimeter (coarse IP guard only).
        # The location / catch-all below must remain: nginx longest-prefix
        # matching routes /public/... here.
        location /public/ {
            limit_req zone=public_limit burst=1000 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            # Phase 298 (D-12): no server-level add_header exists here, so this
            # is the only X-Request-ID on the response — covers nginx-generated
            # 429s too.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 318 (D-04/D-06, REL-01): the SPA reads the application version
        # from the backend at runtime. Without this exact-match block a request
        # to /health lands on `location /` below and returns the SPA document
        # (`<!doctype html>`) instead of the backend's JSON — and the strict
        # `connect-src 'self'` policy forbids calling the backend port directly.
        # CSP is unchanged: this block serves JSON only.
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 95 — catch-all for SPA + Vite HMR WebSocket. The
        # proxy_http_version/Upgrade/Connection headers are required so
        # Vite's HMR WebSocket at wss://nginx/?token=... upgrades correctly.
        # Without them, Vite's connection retries race the page-load chunk
        # requests and surface as net::ERR_FAILED in the browser.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;

            # Phase 96 — Security headers on the SPA root document (HEADERS-01)
            # CSP mirrors backend/app/middleware/security_headers.py DEVELOPMENT CSP
            # (not production) — REVIEW FIX: this compose stack's `frontend` container
            # always runs the Vite dev server (npm run dev), in every environment; there
            # is no production build/serve path. nginx.conf is a static, non-templated
            # file (mounted :ro, no envsubst), so it cannot vary by ENVIRONMENT the way
            # the backend's /api/v1/* CSP does — it must pick one CSP for all environments,
            # and the strict production CSP (no 'unsafe-eval'/ws:) would break Vite's dev
            # client/HMR on every page load, not just in a "production" test. If the backend
            # dev CSP is updated, keep this block in sync.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), autoplay=(), display-capture=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
            # Credentialed plugin bundle text executes as a blob: module; data: scripts stay refused.
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https:; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; upgrade-insecure-requests" always;

            proxy_pass http://frontend;
        }
    }
}
