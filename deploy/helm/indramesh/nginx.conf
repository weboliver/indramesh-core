# k3s variant of nginx/nginx.conf (Phase 258, D-03). Adapts only: pid/error_log
# runtime mechanics for an unprivileged non-root container, the two port binds
# (8080/8443 instead of 80/443), the frontend upstream (the Phase 257 production
# Caddy Service on 8080 instead of the Compose Vite dev port 5173), a
# probe-only /healthz location, and the CSP (WR-03: the Compose variant ships the
# DEVELOPMENT CSP because its frontend is always the Vite dev server; the k8s
# variant fronts the Phase 257 production static build, so it carries the
# PRODUCTION CSP matching backend/app/middleware/security_headers.py). Every
# rate-limit zone, the gzip block, all location/proxy blocks (incl. the Phase 279 upload exception), the remaining
# security headers, and the TLS directives are preserved verbatim from the
# Compose source of truth.
#
# `pid` is a main-context-only directive (nginx rejects it inside `http {}`
# with "pid directive is not allowed here") — live-caught by the Phase 258
# D-07 in-cluster `nginx -t` validation pod on its first real run
# (2026-09-02), since the original 258-01 placement nested it inside `http {}`
# and no prior hermetic test actually invoked `nginx -t` against this file.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    error_log /dev/stderr warn;

    # Phase 298 (D-17): an inbound X-Request-ID is forwarded only when it matches
    # the backend's own validation regex (^[A-Za-z0-9-]{8,64}$); absent, malformed
    # or oversized values fall back to nginx's own $request_id. So nginx and the
    # backend always correlate on the same id, and a client cannot inject an
    # arbitrary header value (T-298-23).
    map $http_x_request_id $indramesh_request_id {
        "~^[A-Za-z0-9-]{8,64}$" $http_x_request_id;
        default                 $request_id;
    }

    # Phase 298 (D-12/D-17): the access log keeps its combined text shape and
    # appends the same rid= the backend records (nginx stays text, not JSON).
    log_format indramesh_main '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rid=$indramesh_request_id';
    access_log /dev/stdout indramesh_main;

    # Loosened for the E2E suite (Phase 138): the single e2e-tests container is
    # the only heavy API consumer in this dev stack and was exhausting the
    # 200r/m cap under full-suite request volume, causing 429s that surfaced as
    # test timeouts. Raised so the full suite passes without retries. Real
    # external clients are still bounded (1000r/m + burst), just less tight.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # D-11 — public realm perimeter zone: coarse IP-based guard only.
    # Per-token limiting happens in the backend (plaintext tokens never
    # enter nginx shared memory — D-09).
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=1000r/m;
    client_max_body_size 1m;

    # Phase 106 — gzip compression for API responses (API-01)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/html application/javascript;
    gzip_proxied any;
    gzip_vary on;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:8080;
    }

    # Phase 95 — HTTP server (unprivileged port 8080) — redirect all traffic to HTTPS
    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Phase 95 — HTTPS server (unprivileged port 8443) — the app, now over TLS
    server {
        listen 8443 ssl http2;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Found live 2026-09-03: nginx auto-redirects a bare "/grafana" (no
        # trailing slash — the natural way to type it) to "/grafana/" for the
        # proxy_pass location below (and identically for /api, /public) —
        # this is nginx's own built-in path-normalization redirect, not
        # anything this chart wrote. By default it emits an ABSOLUTE URL
        # using $server_port, i.e. THIS pod's internal listener (8443) —
        # never externally reachable, since Traefik's
        # passthrough IngressRouteTCP only ever exposes port 443 outward.
        # `absolute_redirect off` makes nginx's own auto-redirects emit a
        # bare relative path ("Location: /grafana/", no scheme/host/port at
        # all) — the browser resolves it against whatever origin it actually
        # used, correct regardless of port/hostname (localhost or the host IP today, any
        # future domain/port later — e.g. a real deployment, see the Strato
        # migration discussion in this session). `port_in_redirect off` alone
        # was tried first and rejected: it still emits an absolute URL, just
        # without the port — coincidentally correct for k8s (no external
        # port) but would be WRONG for the identically-shaped Compose bug
        # (nginx/nginx.conf, non-default host-mapped ports) since Compose
        # genuinely needs a non-default port preserved, not dropped. Verified
        # live: bug and fix both reproduced in an isolated nginx:1.30.4-alpine
        # container before applying here.
        absolute_redirect off;

        # Phase 258 — probe-only endpoint for the Kubernetes startup/readiness/
        # liveness probes. Never proxied; returns 200 with no body.
        location = /healthz {
            return 200;
        }

        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 279 (R-01): upload-route-only ceiling exception. The generic
        # `client_max_body_size 1m` would reject the default 50 MB per-file
        # policy before the backend's authoritative bounded chunk counter
        # could run; `0` disables the static check for exactly this POST
        # location (D-09). Regex locations take precedence over the /api/
        # prefix location; everything else keeps the 1 MiB gateway guard.
        # The backend MaximumContentLengthMiddleware carries the matching
        # route-only exemption (backend/app/main.py).
        location ~ ^/api/v1/objects/[^/]+/files/upload$ {
            limit_req zone=api_limit burst=1000 nodelay;
            limit_req_status 429;
            client_max_body_size 0;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 317 (CR314-24): the two CSV import uploads carry their own
        # bounded ceiling. Both routes stream the body into a handler-side
        # `IMPORT_MAX_FILE_SIZE` check (default 50 MiB) that stays authoritative;
        # the generic `client_max_body_size 1m` above would refuse every body
        # between 1 MiB and that documented limit before the handler ever ran.
        # 64m deliberately, not `0` like the object-file location above: that
        # path relays into storage without ever holding the file, whereas the
        # CSV handler accumulates up to its limit in memory — an unbounded
        # gateway would hand it an arbitrarily large stream. 64 MiB sits above
        # the 50 MiB default so the handler decides for every body the
        # documentation promises. Raising IMPORT_MAX_FILE_SIZE past 64 MiB
        # means raising this ceiling in BOTH nginx/nginx.conf and
        # deploy/helm/indramesh/nginx.conf (the chart embeds its copy verbatim).
        # Anchored and POST-only in the backend's matching exemption tuple
        # (backend/app/main.py `_BODY_LIMIT_EXEMPT_POST_PATHS`) — never widen
        # this to a path prefix, which would exempt every method on
        # /api/v1/imports/* as well. These two files must stay identical here.
        location ~ ^/api/v1/(imports/csv/upload|import-definitions/[^/]+/folder-files)$ {
            limit_req zone=api_limit burst=1000 nodelay;
            limit_req_status 429;
            client_max_body_size 64m;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        location /api/ {
            limit_req zone=api_limit burst=1000 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            # Replace the upstream sniffing header with exactly one gateway copy;
            # "always" also covers nginx-generated 429/502/504 responses.
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            # Phase 298 (D-12): nginx owns this header on every response,
            # including its own 413/429, so hide the upstream copy and echo ours.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # D-11 / AUTH-05 — public realm perimeter (coarse IP guard only).
        # The location / catch-all below must remain: nginx longest-prefix
        # matching routes /public/... here.
        location /public/ {
            limit_req zone=public_limit burst=1000 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Phase 298 (D-17): forward the resolved request id to the backend.
            proxy_set_header X-Request-ID $indramesh_request_id;
            # Phase 298 (D-12): no server-level add_header exists here, so this
            # is the only X-Request-ID on the response — covers nginx-generated
            # 429s too.
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 261 (MON-03, D-06, Pitfall 3): Grafana via the existing
        # front door. The Traefik L4 passthrough IngressRouteTCP
        # owns every SNI, so no new IngressRoute/Route is rendered —
        # the nginx location IS the Grafana path. The trailing slash on
        # proxy_pass strips the /grafana/ prefix; Grafana renders under the
        # sub-path via root_url/serve_from_sub_path (monitoring-values.yaml).
        # Cross-namespace upstream must use the FQDN (no upstream block).
        # Unconditional by design: when monitoring.enabled is false the path
        # simply 502s (nothing links to it) — documented in 261-03-SUMMARY.md.
        location /grafana/ {
            # Found live 2026-09-03: a trailing slash on proxy_pass's target URL
            # makes nginx STRIP the "/grafana/" location prefix before forwarding
            # (upstream sees "/" instead of "/grafana/..."). Grafana is
            # configured with serve_from_sub_path: true (monitoring-values.yaml),
            # which per Grafana's own docs requires the OPPOSITE — the sub-path
            # must reach Grafana unmodified so it can match its own root_url
            # (https://localhost/grafana/). With the prefix stripped, Grafana
            # received "/", didn't recognize it as its own root, and 301'd back
            # to https://localhost/grafana/ — which nginx stripped again on
            # the next hop: an infinite redirect loop (curl: "Too many
            # redirects"), reproduced live. No trailing slash on the proxy_pass
            # target forwards the URI unchanged, matching what serve_from_sub_path
            # expects.
            proxy_pass http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Phase 262 (UI-K8S-01, D-09/D-10): Headlamp via the existing
        # front door. The Traefik L4 passthrough IngressRouteTCP
        # owns every SNI, so no new IngressRoute/Route is rendered —
        # the nginx location IS the Headlamp path. Unconditional by design:
        # when headlamp.enabled is false the path simply 502s (nothing links
        # to it) — the Grafana precedent. nginx.conf is embedded verbatim via
        # .Files.Get (nginx-configmap.yaml), so Helm conditionals are
        # impossible here anyway.
        #
        # The /grafana/ lesson, in REVERSE: Headlamp runs with
        # -base-url=/headlamp (headlamp-deployment.yaml), so it expects the
        # /headlamp/... URI to reach it UNCHANGED. A trailing slash on the
        # proxy_pass target would strip the location prefix (exactly what
        # Grafana's serve_from_sub_path needed) and contradict Headlamp's
        # configured base-url — same 404/redirect-loop mechanics as the
        # Grafana bug above. No trailing slash on the proxy_pass target
        # forwards the URI unchanged.
        location /headlamp/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_pass http://headlamp:4466;
        }

        # Phase 318 (D-04/D-06, REL-01): the SPA reads the application version
        # from the backend at runtime. Without this exact-match block a request
        # to /health lands on `location /` below and returns the SPA document
        # (`<!doctype html>`) instead of the backend's JSON — and the strict
        # `connect-src 'self'` policy forbids calling the backend port directly.
        # CSP is unchanged: this block serves JSON only.
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $indramesh_request_id;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $indramesh_request_id always;
        }

        # Phase 95 — catch-all for the SPA. The
        # proxy_http_version/Upgrade/Connection headers are retained from the
        # Compose source of truth (where they serve Vite's HMR WebSocket);
        # the k8s variant's frontend is the Phase 257 production Caddy static
        # serve, which uses no WebSocket — the headers are inert here and kept
        # only to stay byte-identical with the Compose location block.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;

            # Phase 96 — Security headers on the SPA root document (HEADERS-01)
            # CSP mirrors backend/app/middleware/security_headers.py PRODUCTION CSP
            # (WR-03): the k8s frontend is the Phase 257 production Caddy static
            # build, so the development relaxations are dropped — no 'unsafe-eval',
            # no 'unsafe-inline' in script-src, and no ws: in connect-src (the
            # production SPA uses no WebSocket; verified against frontend/src).
            # Credentialed plugin bundle text executes as a blob: module;
            # data: scripts remain refused in this production directive.
            # The Compose source of truth (nginx/nginx.conf) intentionally keeps
            # the development CSP because its frontend container always runs the
            # Vite dev server. If the backend production CSP is updated, keep this
            # block in sync.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), autoplay=(), display-capture=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https:; object-src 'none'; script-src 'self' 'sha256-v0eyc3ElBkHCqhoUgmd/A7DpL4b64kE4k98h3h3HSjE=' blob:; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests" always;

            proxy_pass http://frontend;
        }
    }
}
