{{- /*
backend-serviceaccount.yaml — the backend ServiceAccount (Phase 257/T-255-11
wiring, relocated to its own template by Phase 305 / LOGX-05 when the
system-logs Pod-log Role and RoleBinding were deleted). The backend no longer
queries the Kubernetes API, so backend-deployment.yaml runs with
automountServiceAccountToken: false; the ServiceAccount itself stays because
the Deployment still sets serviceAccountName: indramesh-backend.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: indramesh-backend
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}