apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      # D-06 boundary relaxation (user-approved): pod-level fsGroup grants the
      # wrapper UID 70 group ownership on the local-path PVC, so initdb's chmod
      # on the pgdata dir succeeds. OnRootMismatch avoids rescanning the whole
      # volume when ownership already matches. The container-level restricted
      # helper stays unchanged (runAsNonRoot, no escalation, read-only root).
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            {{- include "indramesh.restrictedSecurityContext" . | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indramesh-database
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U ${POSTGRES_USER}"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U ${POSTGRES_USER}"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U ${POSTGRES_USER}"]
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: data
              mountPath: /var/lib/postgresql/pgdata
              subPath: pgdata
            - name: postgres-socket
              mountPath: /var/run/postgresql
      volumes:
        - name: postgres-socket
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.storage }}
