{{- /*
storage-statefulset.yaml — the storage-service ClusterIP Service and one-replica
StatefulSet + PVC for the k3s release (Phase 278, SC-01 Kubernetes half; D-02:
shares the backend image, no separate build). Rendered ONLY when apps.enabled
is true — unlike the always-rendered postgres/redis/opensearch StatefulSets,
the storage workload depends on the app-tier backend image, which only exists
in containerd after the D-16 two-pass install's full pass. Uses the exact
gate backend-deployment.yaml / worker-deployment.yaml use.

PVC-ownership boundary (T-278-02-02): a freshly provisioned PVC is NOT
pre-populated/chowned from image content the way Docker populates a fresh
Compose named volume. The backend image bakes group-0 write access into its own
filesystem paths, so pod-level fsGroup: 0 (not an arbitrary GID like redis's
fsGroup: 999 — the storage image IS group-0-prepared) grants the arbitrary
restricted-PSA UID write access to /data/storage on first mount;
fsGroupChangePolicy: OnRootMismatch avoids rescanning the whole volume when
ownership already matches. The container-level securityContext stays the shared
indramesh.restrictedSecurityContext helper — no fixed UID/GID (group 0 supplies
write access).
*/ -}}
{{- if .Values.apps.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storage
  ports:
    - name: storage
      port: 8001
      targetPort: storage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  serviceName: storage
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
    spec:
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: storage
          image: "{{ .Values.apps.backend.image.repository }}:{{ .Values.apps.backend.image.tag }}"
          imagePullPolicy: {{ .Values.apps.backend.image.pullPolicy }}
          # D-02/D-03: the shared backend image with the storage-service ASGI
          # entrypoint on its own port 8001 (Plan 278-01).
          command: ["uvicorn", "app.storage_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
          ports:
            - name: storage
              containerPort: 8001
          securityContext:
            {{- include "indramesh.restrictedSecurityContext" . | nindent 12 }}
          env:
            {{- include "indramesh.loggingEnv" . | nindent 12 }}
            - name: STORAGE_BLOB_ROOT
              value: /data/storage
            - name: STORAGE_BUCKET
              value: indramesh
          resources:
            {{- toYaml .Values.apps.storage.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: storage
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: storage
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: storage
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.apps.storage.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.apps.storage.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.apps.storage.persistence.storage }}
{{- end }}