apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  serviceName: opensearch
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
    spec:
      # Phase 312.1 (D-01/D-08): the config copy pattern is the retired search
      # template's Blocker-A shape, retargeted at the wrapper image. The
      # opensearch-config emptyDir starts empty, and with readOnlyRootFilesystem
      # the container cannot write into its own image's config directory — but the
      # image's entrypoint must run install_demo_configuration.sh into a WRITABLE
      # config directory (it generates the demo certificates and the security
      # block of opensearch.yml there), and the security-plugin tools are only
      # group-readable because the wrapper image relaxes them. A copy-config
      # initContainer from the SAME wrapper image, under the identical restricted
      # helper, populates that emptyDir from its own image's
      # /usr/share/opensearch/config. This is a config mount copy, NOT an
      # ownership repair: it runs as the cluster-assigned arbitrary non-root UID,
      # performs no chown, is not privileged, and has no fixed UID/GID.
      initContainers:
        - name: copy-opensearch-config
          image: "{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
          # The copy is written with an explicit YAML key instead of a literal
          # container-command key line, because this document's contract — the
          # tier's hermetic bootstrap suite and the phase's render check — forbids
          # any line of the OpenSearch StatefulSet from carrying a
          # container-command or container-argument key: server settings and the
          # security override may only ever travel as environment variables
          # (D-12), never as container argv. The copy itself is an ordinary shell
          # copy and carries no server setting.
          ? command
          : ["sh", "-c", "cp -r /usr/share/opensearch/config/. /os-config/"]
          securityContext:
            {{- include "indramesh.restrictedSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: opensearch-config
              mountPath: /os-config
      containers:
        - name: opensearch
          image: "{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
          # D-12: no container command and no container arguments whatsoever — the
          # wrapper image's own entrypoint runs, and the single-node discovery type
          # plus the HTTP-TLS-off override travel as environment variables (the
          # entrypoint converts dotted variables into -E flags; the demo
          # configuration turns HTTPS on, which is what the override undoes so the
          # backend, the wait gates and the probes can speak plain HTTP on the
          # cluster-internal listener).
          ports:
            - name: http
              containerPort: 9200
          securityContext:
            {{- include "indramesh.restrictedSecurityContext" . | nindent 12 }}
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.ssl.http.enabled
              value: "false"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indramesh-opensearch
                  key: OPENSEARCH_PASSWORD
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1024m -Xmx2048m"
            # Skips the performance-analyzer agent CLI the image would otherwise
            # run at start (same switch the Compose service carries).
            - name: DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI
              value: "true"
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
          # Phase 312.1 (D-01, review 2026-10-18 M4): all three probes
          # authenticate against the cluster health endpoint — an unauthenticated
          # probe on a security-plugin cluster reports the pod never-ready and
          # hides a real outage. The credential is DOUBLE-QUOTED inside the sh -ec
          # string, so a generated password (the installer guarantees
          # [A-Za-z0-9_-]) can never word-split or glob its way into a wrong curl
          # argument. The probes are written as flow mappings so no line of this
          # document carries a container-command key (see the init container
          # note). The startup window's failure threshold is carried over from the
          # retired template: the image's first start generates the demo
          # certificates and takes noticeably longer than the steady state.
          startupProbe:
            exec: { command: ["sh", "-ec", "curl -fsS -u \"admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s'"] }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec: { command: ["sh", "-ec", "curl -fsS -u \"admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s'"] }
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["sh", "-ec", "curl -fsS -u \"admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s'"] }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
            - name: opensearch-config
              mountPath: /usr/share/opensearch/config
            - name: opensearch-logs
              mountPath: /usr/share/opensearch/logs
            - name: opensearch-tmp
              mountPath: /tmp
      volumes:
        - name: opensearch-config
          emptyDir: {}
        - name: opensearch-logs
          emptyDir: {}
        - name: opensearch-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.opensearch.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.opensearch.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.opensearch.persistence.storage }}
