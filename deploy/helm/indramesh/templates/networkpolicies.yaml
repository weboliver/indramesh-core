---
# Phase 278 (SC-01 Kubernetes half, T-278-02-01): destination-side ingress half
# of the matched storage edge. Admits ONLY indramesh-backend/indramesh-worker
# pods on storage:8001; every other pod (frontend, nginx, headlamp, ...) has
# zero route to storage under the namespace-wide default-deny-all baseline. The
# source-side egress half lives in allow-backend-worker-egress — NetPol enforces
# both axes independently.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storage-ingress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storage
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [indramesh-backend, indramesh-worker]}
      ports:
        - protocol: TCP
          port: 8001
---
