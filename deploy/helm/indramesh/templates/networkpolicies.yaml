{{- /*
networkpolicies.yaml — namespace-wide default-deny + the exact D-09 allow matrix
as MATCHED ingress+egress NetworkPolicy documents for the indramesh namespace
(NET-04, D-09/D-10, T-259-11..15). Rendered ONLY when networkPolicies.enabled
is true (D-10) — a Helm rerun with the toggle off renders zero NetworkPolicy
documents (troubleshooting without kubectl delete).

Kubernetes NetworkPolicy enforces ingress and egress INDEPENDENTLY: a
connection is permitted only when BOTH the source pod's egress rules AND the
destination pod's ingress rules admit it. Because default-deny-all uses
podSelector: {} with policyTypes [Ingress, Egress], every indramesh-internal edge
therefore needs a document on BOTH sides — the source-owned egress half AND
the destination-owned ingress half (review-phase correction, 2026-09-02).
Only edges whose destination lives OUTSIDE the indramesh namespace (kube-dns,
kube-apiserver) are legitimately egress-only. Reply traffic for allowed
connections is implicitly allowed; traffic to/from the node hosting the
selected pod is always allowed per Kubernetes docs, so kubelet probes need no
preemptive exception (decision 3, D-11).

Selectors are used for every indramesh-internal peer (never ipBlock — Service
DNAT makes ipBlock brittle; ipBlock is reserved for the installer-discovered
kube-apiserver /32, research Pitfall 5). No generic external egress (D-12).
*/ -}}
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-egress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-backend
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-frontend
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.monitoring.enabled }}
    # Phase 261 (MON-03, D-06, Pitfall 3): nginx -> Grafana front-door edge.
    # Only nginx may egress to the Grafana Service across namespaces (T-261-06
    # accepted exposure: same trust domain; from the indramesh side this clause is
    # the only path to grafana:80). Gated monitoring.enabled like the
    # prometheus scrape clause above.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.stackNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
    {{- if .Values.headlamp.enabled }}
    # Phase 262 (UI-K8S-01, D-10, Pitfall 8): nginx -> headlamp front-door
    # edge (the source-owned egress half of the matched pair; the destination
    # half is allow-headlamp-ingress). Same-namespace peer, so a plain
    # podSelector — never ipBlock (File-Header contract). Gated
    # headlamp.enabled like the grafana clause above.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: headlamp
      ports:
        - protocol: TCP
          port: 4466
    {{- end }}
---
{{- if .Values.headlamp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-headlamp-ingress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - protocol: TCP
          port: 4466
{{- end }}
---
{{- if and .Values.headlamp.enabled .Values.networkPolicies.apiServerCidr }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-headlamp-egress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.apiServerCidr }}
      ports:
        - protocol: TCP
          port: 443
    # Phase 318 (host-B clean-host finding): port-only, no `to`. k3s's
    # NetworkPolicy implementation matches egress AFTER the DNAT, so the
    # ClusterIP ipBlock above never matches there and Headlamp would lose API
    # access. No IP binding on purpose: a WSL2 node's API endpoint is its eth0
    # address (changes on every restart) and a multi-control-plane cluster has
    # more than one — 443 covers Service-port setups, 6443 the k3s apiserver.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: indramesh-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-frontend
      ports:
        - protocol: TCP
          port: 8000
    # Phase 261 (OPS-01, Pitfall 2): the smoke-test hook Job pod's
    # destination-side ingress clause on backend:8000 — the source-side egress
    # half lives in allow-smoke-test-egress; NetPol enforces both axes
    # independently. Admits ONLY the indramesh-smoke-test pod (T-261-04).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-smoke-test
      ports:
        - protocol: TCP
          port: 8000
    {{- if .Values.monitoring.enabled }}
    # Phase 261 (MON-02, D-06, Pitfall 2): Prometheus scrape edge — the
    # destination-side ingress document is the one that matters (the monitoring
    # namespace has no default-deny). Admits ONLY the stack's Prometheus pod
    # (podSelector app.kubernetes.io/name: prometheus within namespace
    # monitoring) on the /metrics port, gated monitoring.enabled — no other
    # cross-namespace pod can reach backend:8000 through this NetPol (T-261-04).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.stackNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: indramesh-frontend
  policyTypes: [Egress]
  # The init wait-backend edge (frontend-deployment.yaml:64) — NetworkPolicy
  # cannot distinguish an init container from the regular container in the
  # same pod (research Pitfall 4). No other destination, no stateful port.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-backend
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: indramesh-frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-worker-egress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [indramesh-backend, indramesh-worker]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
      ports:
        - protocol: TCP
          port: 9200
    # Phase 278 (SC-01 Kubernetes half): backend/worker -> storage:8001
    # source-side egress half of the matched pair (the destination half is
    # allow-storage-ingress). Same podSelector as the postgres/valkey/
    # opensearch entries above, so it belongs in this policy, not a second
    # egress document.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: storage
      ports:
        - protocol: TCP
          port: 8001
    # Phase 305 (LOGX-01, D-12/T-305-02): the source-side egress half of the
    # matched backend→Loki pair. The destination half is the installer-owned
    # scripts/k8s/loki-backend-ingress-netpol.yaml (NetworkPolicies are
    # additive, so the chart's Alloy-from-monitoring ingress policy stays
    # intact). Only the backend issues Loki queries (only it mounts plugin
    # routes); this document already scopes both workloads, so the rule is
    # granted to the shared backend+worker selector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.stackNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    {{- /* Phase 305 (LOGX-05): the backend/worker apiserver-egress clause was
         removed with the System Logs provider — no Core workload calls the
         Kubernetes API any more. The installer-discovered apiserver CIDR
         value stays in values for its remaining consumer (headlamp's opt-in
         egress, asserted by test_headlamp.sh). */}}
    {{- /* Phase 302 (LLM-05, D-12): opt-in egress to the configured LLM
         endpoint(s). Empty llmEgress emits nothing (fail-closed). Each entry
         must be an IP range + port — NetworkPolicy cannot express a hostname,
         so the chart rejects a non-CIDR value at render time rather than
         deferring the failure to the API server at apply time. Phase 318
         (K8S-LLM-EGRESS-01): externalEgress entries share the same contract. */}}
    {{- range $list := list "llmEgress" "externalEgress" }}
    {{- range (index $.Values.networkPolicies $list | default list) }}
    {{- $cidr := required (printf "networkPolicies.%s[].cidr is required" $list) .cidr }}
    {{- $port := required (printf "networkPolicies.%s[].port is required" $list) .port }}
    {{- if not (regexMatch "^[0-9a-fA-F:.]+/[0-9]{1,3}$" $cidr) }}
    {{- fail (printf "networkPolicies.%s[].cidr must be an IP range (e.g. 203.0.113.10/32), not a hostname: %q" $list $cidr) }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ $cidr }}
      ports:
        - protocol: TCP
          port: {{ $port }}
    {{- end }}
    {{- end }}
    {{- /* Phase 318 (K8S-LLM-EGRESS-01): public-address egress on the listed
         ports, every private/cluster range excepted (values.yaml). */}}
    {{- with .Values.networkPolicies.publicEgress }}
    {{- if and .enabled .ports }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .except }}
            except:
              {{- range . }}
              - {{ . }}
              {{- end }}
            {{- end }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [indramesh-backend, indramesh-worker]}
      ports:
        - protocol: TCP
          port: 5432
    # Phase 311.1 (clean-host finding): the PLUGIN migration hook runs in its own
    # Job whose pods carry app.kubernetes.io/name=indramesh-plugin-migration
    # (migration-job.yaml) — it must be admitted here exactly like the core
    # migration Job, or default-deny-all cuts it off from Postgres and the
    # post-upgrade hook fails, failing the whole `helm upgrade --wait-for-jobs`.
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [indramesh-migration, indramesh-plugin-migration]}
      ports:
        - protocol: TCP
          port: 5432
    # Phase 296 (CLEAN-05, D-10): the clear-queue hook marks the Tasks orphaned
    # by the queue clear FAILED. The egress half lives in
    # allow-maintenance-clear-queue-egress.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-maintenance-clear-queue
      ports:
        - protocol: TCP
          port: 5432
    # Phase 260 (BAK-01, D-09, Pitfall 4): the backup CronJob pod's dump
    # connection — mirrors the indramesh-migration clause immediately above.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-backup
      ports:
        - protocol: TCP
          port: 5432
    # Phase 261 (OPS-01, Pitfall 2): the smoke-test hook Job pod's DB-connect
    # clause — mirrors the indramesh-backup clause immediately above (same shape,
    # TCP 5432). The egress half lives in allow-smoke-test-egress.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: indramesh-smoke-test
      ports:
        - protocol: TCP
          port: 5432
---
