    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [indramesh-migration, indramesh-plugin-migration]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
