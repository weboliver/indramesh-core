{{- /* OpenShift-only router peer (A5): capability-gated and isolated in its own
     document. Selector matches the real OpenShift router-default Deployment's
     pod labels (app: router AND router: router-default — gap-closure fix,
     259-REVIEW.md WR-02); live admission on a real OpenShift cluster remains
     unverified in this environment and stays a Manual-Only human_verification
     item (no OPS-05 phase exists in the roadmap). */ -}}
{{- if .Capabilities.APIVersions.Has "route.openshift.io/v1" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-router-ingress
  namespace: indramesh
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              app: router
